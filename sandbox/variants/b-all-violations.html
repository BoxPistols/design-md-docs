<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>B — all violations</title>
<link rel="stylesheet" href="../theme.vars.css"><link rel="stylesheet" href="../base.css">
<style>
  /* === 意図的な違反 5件 === */
  /* V1: アクセント色を文字に使う（Don't: 文字に使わない） */
  .title { color: var(--color-accent); }
  /* V2: Bold を使う（Don't: 700以上を使わない / 最大600） */
  .title { font-weight: 800; }
  /* V3: 角丸を 3px 超にする（Don't: 3px より大きくしない） */
  .card { border-radius: 18px; }
  .button { border-radius: 999px; }
  /* V4: ドロップシャドウを付ける（Don't: 影を使わない） */
  .card { box-shadow: 0 12px 32px rgba(30,26,23,.28); }
  /* V5: グラデーションを使う（Don't: すべての面は単色） */
  .button { background: linear-gradient(135deg, #C4512F 0%, #6E2517 100%); }
</style>
  <div class="card">
    <div class="meta">Oil on canvas · 1897</div>
    <h1 class="title">Evening Study, Harbour Wall</h1>
    <hr class="rule">
    <p class="body">
      画家が晩年を過ごした港町で描かれた連作のうちの一点。日没後のわずかな時間、
      石壁が熱を手放していく様子を、限られた顔料で捉えている。厚塗りを避け、
      下地の亜麻布の目を残すことで、湿った空気の質感を得ている。
    </p>
    <div class="spec">
      <div class="meta">寸法 — 610 × 455 mm</div>
      <div class="meta">所蔵 — 市立美術館</div>
      <div class="meta">整理番号 — INV. 1962-114</div>
    </div>
    <button class="button">詳細を見る</button>
  </div>
</body></html>
